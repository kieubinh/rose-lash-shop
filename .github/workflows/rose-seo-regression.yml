name: Rose SEO & regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-seo:
    name: Static SEO and booking regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check client-side scripts
        run: |
          node --check app.js
          node --check rose-v4-v5.js
          node --check api/booking.js
      - name: Validate SEO, V4/V5 interactions and service catalogue
        run: node --test tests/test_seo_v6.cjs tests/test_v4_v5.cjs
      - name: Check booking endpoint is fail-closed without credentials
        run: node tests/test_booking.cjs
